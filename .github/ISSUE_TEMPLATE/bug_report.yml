name: Bug report
description: Something in Tapeman doesn't work as it should.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: input
    id: phone
    attributes:
      label: Phone and Android version
      placeholder: Galaxy Z Fold, Android 16
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Tapeman version
      description: Android Settings → Apps → Tapeman.
      placeholder: 0.2.1
    validations:
      required: true
  - type: dropdown
    id: source
    attributes:
      label: Source in the deck
      options:
        - Plex Server
        - Spotify
        - Local folder
        - Apple Music (in-app MusicKit)
        - Apple Music (driving media session)
        - YT Music
        - Not about playback
    validations:
      required: true
  - type: dropdown
    id: posture
    attributes:
      label: Posture
      multiple: true
      options:
        - Folded (cover screen)
        - Unfolded (portrait)
        - Unfolded (landscape)
        - Half-open on a table (Flex mode / Tabletop)
  - type: textarea
    id: media
    attributes:
      label: Screenshots, recordings or logs
      description: For crashes, attach the output of `adb logcat -d -b crash`.
