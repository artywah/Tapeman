name: Idea or feature request
description: Suggest something Tapeman should do.
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes:
      label: The idea
      description: What would you like Tapeman to do, and why? Real cassette players are fair game for inspiration.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Anything else
      description: Sketches, photos of real hardware, links.
